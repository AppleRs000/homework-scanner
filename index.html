<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.webmanifest">
<title>宿題提出スキャナー</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#2563eb;color:#fff;text-align:center;padding:14px;font-size:21px;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:10px}
.card,.status,.last{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px}.card h2{margin:0 0 12px}
button,input,select{font-size:17px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:8px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold}.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.gray{background:#64748b;color:#fff}.red{background:#dc2626;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.scan{width:100%;background:#16a34a;color:#fff;font-size:23px;padding:18px;margin-bottom:8px}.scan.stop{background:#dc2626}.cam{width:100%;background:#2563eb;color:#fff;font-size:18px;padding:14px;margin-bottom:10px}
.reader{background:#000;border-radius:16px;overflow:hidden;margin-bottom:10px}.reader #reader{width:100%;min-height:45vh}.reader video{width:100%!important;height:auto!important}
.last{text-align:center}.last small{color:#666}.lastno{font-size:70px;font-weight:900;line-height:1}.lastmsg{font-size:22px;font-weight:bold}
.count{text-align:center;font-size:58px;font-weight:900}.progress{height:22px;background:#ddd;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#22c55e}
.remaining{margin-top:12px;background:#fff1f2;border-radius:12px;padding:12px;text-align:center}.remaining.ok{background:#dcfce7}.remaining-title{font-size:22px;font-weight:bold}.nums{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.num{border:2px solid #f87171;background:#fff;border-radius:9px;padding:5px 9px;font-weight:bold}
.targets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.target{padding:8px 2px;text-align:center;border:2px solid #ddd;border-radius:9px}.target.off{background:#eee;color:#999}
.info{background:#eff6ff;border-radius:10px;padding:10px}.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.date{background:#dbeafe;color:#1d4ed8;padding:5px 8px;border-radius:8px}
.notice{background:#fefce8;border:1px solid #fde68a;border-radius:12px;padding:12px;margin-bottom:10px}.small{font-size:13px;color:#666}
.tablewrap{overflow:auto;border:1px solid #ddd;border-radius:10px}.matrix{border-collapse:separate;border-spacing:0;min-width:650px;width:100%;font-size:14px}.matrix th,.matrix td{padding:7px 9px;text-align:center;border-right:1px solid #ddd;border-bottom:1px solid #ddd;white-space:nowrap}.matrix th{background:#f1f5f9;position:sticky;top:0;z-index:2}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:3;background:#fff}.matrix th:first-child{background:#e2e8f0}.circle,.cross{font-size:18px}.rate{font-weight:bold}.qrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qr{border:1px solid #ddd;border-radius:10px;text-align:center;padding:10px}.qrcode{display:flex;justify-content:center}
@media(max-width:600px){.targets{grid-template-columns:repeat(4,1fr)}.qrgrid{grid-template-columns:repeat(2,1fr)}.lastno{font-size:62px}.count{font-size:50px}}
</style>
</head>
<body>
<header>📚 宿題提出スキャナー</header>
<div class="wrap">

<div class="notice">
<strong>今回の変更</strong><br>
提出記録は日付ごとに別ファイルにするのではなく、端末内に累積保存します。<br>
「提出状況一覧」は <strong>行＝児童、列＝宿題（日付）</strong> です。提出＝⭕、未提出＝❌、対象外・欠席＝—。
</div>

<button id="scanBtn" class="scan" onclick="toggleScanner()">🔊 スキャン開始</button>
<button id="camBtn" class="cam" onclick="switchCamera()">🤳 カメラ切替</button>
<div class="reader"><div id="reader"></div></div>

<div class="last">
<small>最後に読み取った番号</small>
<div id="lastNo" class="lastno">--</div>
<div id="lastMsg" class="lastmsg">QRコードを読み取ってください</div>
</div>

<div class="status">
<div id="count" class="count">0 / 0</div>
<div style="text-align:center;color:#666">今日の提出状況</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="absentInfo" class="small" style="text-align:center;margin-top:7px"></div>
<div id="excludeInfo" class="small" style="text-align:center"></div>
<div id="remaining" class="remaining"><div id="remainingTitle" class="remaining-title"></div><div id="remainingList" class="nums"></div></div>
</div>

<div class="card">
<h2>📝 今日の宿題</h2>
<select id="taskSelect" onchange="changeTask()"></select>
<div id="taskInfo" class="info"></div>
<div class="row"><button class="blue" onclick="addTask()">＋ 宿題追加</button><button class="red" onclick="deleteTask()">🗑 削除</button></div>
</div>

<div class="card">
<h2>📅 宿題の日付設定</h2>
<input id="taskDate" type="date">
<button class="green" onclick="addDate()">＋ この日を追加</button>
<div id="dates" class="dates"></div>
</div>

<div class="card">
<h2>👦 提出対象</h2>
<div style="margin-bottom:8px"><button class="green" onclick="allTargets(true)">全員ON</button> <button class="gray" onclick="allTargets(false)">全員OFF</button></div>
<div id="targets" class="targets"></div>
<div class="small">OFFにした児童は、その宿題の日の提出率計算から除外します。</div>
</div>

<div class="card">
<h2>🚫 欠席登録</h2>
<input id="absentNo" type="number" inputmode="numeric" placeholder="出席番号">
<button class="gray" onclick="registerAbsent()">欠席として登録</button>
</div>

<div class="card">
<h2>⚙️ クラス設定</h2>
<label>クラス番号</label><input id="prefix" type="number" min="1" max="99">
<label>学級人数</label><input id="size" type="number" min="1" max="99">
<button class="green" onclick="saveClass()">💾 設定を保存</button>
</div>

<div class="card">
<h2>📊 提出状況一覧</h2>
<div class="small">⭕＝提出　❌＝未提出　—＝対象外・欠席　／　最後の列は累積提出率</div>
<div class="row" style="margin-top:8px"><button class="blue" onclick="renderMatrix()">🔄 更新</button><button class="green" onclick="exportCSV()">📥 CSV保存</button></div>
<div id="matrix" style="margin-top:10px"></div>
</div>

<div class="card">
<h2>🔳 QRコード作成</h2>
<button class="blue" onclick="makeQR()">QRコードを作成</button>
<div id="qrgrid" class="qrgrid" style="margin-top:12px"></div>
</div>

</div>

<script>
const K={tasks:"hs_tasks_v1",data:"hs_data_v1_",size:"hs_size_v1",prefix:"hs_prefix_v1"};
let tasks=[],taskId=null,data={submitted:{},absent:[]},date="";
let scanner=null,running=false,cameras=[],camIndex=0,lock=false,lastCode="",lastTime=0,audio=null;

const today=()=>{let d=new Date(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${d.getFullYear()}-${m}-${day}`};
const size=()=>parseInt(localStorage.getItem(K.size)||"37",10);
const prefix=()=>String(localStorage.getItem(K.prefix)||"31").padStart(2,"0");
const ids=()=>Array.from({length:size()},(_,i)=>String(i+1).padStart(2,"0"));
const idOf=v=>{v=String(v).trim().replace(/[０-９]/g,s=>String.fromCharCode(s.charCodeAt(0)-65248));if(!/^\d+$/.test(v))return null;let n=v.length===4&&v.slice(0,2)===prefix()?+v.slice(2):+v;return n>=1&&n<=size()?String(n).padStart(2,"0"):null};
const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const task=()=>tasks.find(t=>t.id===taskId);
const key=(tid,d)=>K.data+tid+"_"+d;

function empty(){return{submitted:{},absent:[]}}
function load(tid,d){try{let x=JSON.parse(localStorage.getItem(key(tid,d))||"null");return x?{submitted:x.submitted||{},absent:x.absent||[]}:empty()}catch{return empty()}}
function save(tid,d,x){localStorage.setItem(key(tid,d),JSON.stringify(x))}
function saveTasks(){localStorage.setItem(K.tasks,JSON.stringify(tasks))}
function target(id,t=task()){return !(t?.targetOff||[]).includes(id)}

function init(){
 document.getElementById("size").value=size();document.getElementById("prefix").value=+prefix();document.getElementById("taskDate").value=today();
 try{tasks=JSON.parse(localStorage.getItem(K.tasks)||"[]")}catch{tasks=[]}
 if(!tasks.length){tasks=[{id:crypto.randomUUID?.()||Date.now().toString(),name:"今日の宿題",dates:[today()],targetOff:[]}];saveTasks()}
 taskId=tasks[0].id;renderSelect();loadCurrent();renderMatrix();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
function renderSelect(){let s=document.getElementById("taskSelect");s.innerHTML="";tasks.forEach(t=>{let o=document.createElement("option");o.value=t.id;o.textContent=t.name;s.appendChild(o)});s.value=taskId}
function changeTask(){taskId=document.getElementById("taskSelect").value;loadCurrent()}
function addTask(){let n=prompt("宿題の名前");if(!n)return;let d=document.getElementById("taskDate").value;let t={id:crypto.randomUUID?.()||Date.now().toString(),name:n,dates:d?[d]:[],targetOff:[]};tasks.push(t);taskId=t.id;saveTasks();renderSelect();loadCurrent();renderMatrix()}
function deleteTask(){let t=task();if(!t||!confirm(`「${t.name}」を削除しますか？`))return;tasks=tasks.filter(x=>x.id!==taskId);taskId=tasks[0]?.id;saveTasks();renderSelect();loadCurrent();renderMatrix()}
function addDate(){let t=task(),d=document.getElementById("taskDate").value;if(!t||!d)return alert("日付を選択してください。");t.dates=t.dates||[];if(!t.dates.includes(d))t.dates.push(d);t.dates.sort();saveTasks();loadCurrent();renderMatrix()}
function removeDate(d){let t=task();t.dates=t.dates.filter(x=>x!==d);saveTasks();loadCurrent();renderMatrix()}
function loadCurrent(){let t=task();date=t?.dates?.includes(today())?today():(t?.dates?.at(-1)||today());data=load(taskId,date);renderTaskInfo();renderTargets();update()}
function renderTaskInfo(){let t=task();document.getElementById("taskInfo").innerHTML=t?`<strong>${esc(t.name)}</strong><br><span class="small">${t.dates?.includes(today())?"📅 今日の提出日":"今日の提出日ではありません"}</span>`:"";let box=document.getElementById("dates");box.innerHTML="";(t?.dates||[]).forEach(d=>{let e=document.createElement("span");e.className="date";e.innerHTML=`${d} <button style="padding:1px 4px;background:none;color:#1d4ed8" onclick="removeDate('${d}')">×</button>`;box.appendChild(e)})}
function renderTargets(){let box=document.getElementById("targets");box.innerHTML="";ids().forEach(id=>{let on=target(id),e=document.createElement("label");e.className="target"+(on?"":" off");e.innerHTML=`<input type="checkbox" ${on?"checked":""} onchange="toggleTarget('${id}',this.checked)"> ${id}`;box.appendChild(e)})}
function toggleTarget(id,on){let t=task();t.targetOff=t.targetOff||[];if(on)t.targetOff=t.targetOff.filter(x=>x!==id);else{if(!t.targetOff.includes(id))t.targetOff.push(id);delete data.submitted[id]}saveTasks();save(taskId,date,data);renderTargets();update();renderMatrix()}
function allTargets(on){let t=task();t.targetOff=on?[]:ids();if(!on)data.submitted={};saveTasks();save(taskId,date,data);renderTargets();update();renderMatrix()}
function update(){let ts=ids().filter(id=>target(id)),abs=ts.filter(id=>data.absent.includes(id)),sub=ts.filter(id=>data.submitted[id]),den=ts.length-abs.length,rate=den?Math.round(sub.length/den*100):100;document.getElementById("count").textContent=`${sub.length} / ${ts.length}`;document.getElementById("bar").style.width=rate+"%";document.getElementById("absentInfo").textContent=`欠席 ${abs.length}人`;document.getElementById("excludeInfo").textContent=`提出対象外 ${ids().length-ts.length}人`;let rem=ts.filter(id=>!data.submitted[id]&&!data.absent.includes(id)),b=document.getElementById("remaining");b.classList.toggle("ok",!rem.length);document.getElementById("remainingTitle").textContent=rem.length?`🔴 あと${rem.length}人`:"🎉 全員提出！！";document.getElementById("remainingList").innerHTML=rem.map(x=>`<span class="num">${x}</span>`).join("")}
function registerAbsent(){let id=idOf(document.getElementById("absentNo").value);if(!id)return alert("正しい番号を入力してください。");if(!target(id))return alert("提出対象外です。");if(!data.absent.includes(id))data.absent.push(id);save(taskId,date,data);document.getElementById("absentNo").value="";update();renderMatrix()}

async function toggleScanner(){running?await stopScanner():await startScanner()}
async function startScanner(){try{audioCtx();cameras=await Html5Qrcode.getCameras();if(!cameras.length)return alert("カメラがありません。");camIndex=Math.max(0,cameras.findIndex(c=>/back|rear|environment/i.test(c.label)));await startCam(cameras[camIndex].id)}catch(e){console.error(e);alert("カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。")}}
async function startCam(cid){scanner=new Html5Qrcode("reader");await scanner.start(cid,{fps:30,qrbox:(w,h)=>{let s=Math.floor(Math.min(w,h)*.75);return{width:s,height:s}},aspectRatio:1},scanFail,scanFail);running=true;document.getElementById("scanBtn").textContent="⏹ スキャン停止";document.getElementById("scanBtn").classList.add("stop")}
async function stopScanner(){if(scanner){try{await scanner.stop()}catch{}try{scanner.clear()}catch{}}scanner=null;running=false;document.getElementById("scanBtn").textContent="🔊 スキャン開始";document.getElementById("scanBtn").classList.remove("stop")}
async function switchCamera(){if(!running)return alert("まずスキャンを開始してください。");if(cameras.length<2)return alert("切替可能なカメラがありません。");camIndex=(camIndex+1)%cameras.length;try{await scanner.stop();await scanner.clear()}catch{}scanner=null;await startCam(cameras[camIndex].id)}
function scanFail(){}
function scanOK(text){let now=Date.now();if(text===lastCode&&now-lastTime<1000)return;lastCode=text;lastTime=now;if(lock)return;lock=true;setTimeout(()=>lock=false,300);let id=idOf(text),n=document.getElementById("lastNo"),m=document.getElementById("lastMsg");if(!id){n.textContent="?";m.textContent="❌ 無効なQR";beep(220);return}n.textContent=id;if(!target(id)){m.textContent="⏸ 提出対象外";beep(330);return}if(data.absent.includes(id)){m.textContent="🚫 欠席登録";beep(330);return}if(data.submitted[id]){m.textContent="⚠️ すでに提出済み";beep(440);return}data.submitted[id]={time:new Date().toLocaleTimeString("ja-JP")};save(taskId,date,data);m.textContent="✅ 提出しました！";beep(880);update();renderMatrix()}
function audioCtx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}
function beep(f){audioCtx();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}

function columns(){let a=[];tasks.forEach(t=>(t.dates||[]).forEach(d=>a.push({t,d})));return a.sort((a,b)=>a.d.localeCompare(b.d)||a.t.name.localeCompare(b.t.name))}
function cell(c,id){let d=load(c.t.id,c.d);if(!target(id,c.t)||d.absent.includes(id))return "—";return d.submitted[id]?"⭕":"❌"}
function rate(id,cs){let s=0,n=0;cs.forEach(c=>{let v=cell(c,id);if(v==="—")return;n++;if(v==="⭕")s++});return n?Math.round(s/n*100):null}
function renderMatrix(){let cs=columns(),box=document.getElementById("matrix");if(!cs.length){box.innerHTML='<div class="small">まだ宿題の日付がありません。</div>';return}let h='<div class="tablewrap"><table class="matrix"><tr><th>番号</th>';cs.forEach(c=>h+=`<th>${esc(c.d.slice(5))}<br>${esc(c.t.name)}</th>`);h+="<th>提出率</th></tr>";ids().forEach(id=>{let r=rate(id,cs);h+=`<tr><td><strong>${id}番</strong></td>`;cs.forEach(c=>{let v=cell(c,id);h+=`<td class="${v==="⭕"?"circle":v==="❌"?"cross":""}">${v}</td>`});h+=`<td class="rate">${r===null?"—":r+"%"}</td></tr>`});box.innerHTML=h+"</table></div>"}
function exportCSV(){let cs=columns();if(!cs.length)return alert("宿題の日付がありません。");let rows=[["出席番号",...cs.map(c=>`${c.d} ${c.t.name}`),"提出率"]];ids().forEach(id=>{let r=rate(id,cs);rows.push([id,...cs.map(c=>cell(c,id)),r===null?"":r+"%"])});let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),u=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="宿題提出一覧.csv";a.click();URL.revokeObjectURL(u)}
function saveClass(){let s=+document.getElementById("size").value,p=+document.getElementById("prefix").value;if(s<1||s>99||p<1||p>99)return alert("設定値を確認してください。");localStorage.setItem(K.size,s);localStorage.setItem(K.prefix,String(p).padStart(2,"0"));renderTargets();update();renderMatrix()}
function makeQR(){let g=document.getElementById("qrgrid");g.innerHTML="";ids().forEach(id=>{let e=document.createElement("div");e.className="qr";e.innerHTML=`<strong>${id}番</strong><div class="qrcode"></div>`;g.appendChild(e);new QRCode(e.querySelector(".qrcode"),{text:prefix()+id,width:170,height:170,correctLevel:QRCode.CorrectLevel.H})})}
window.addEventListener("load",init);
</script>
</body>
</html>
