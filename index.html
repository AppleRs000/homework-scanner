<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,

               initial-scale=1.0,

               maximum-scale=1.0,

               user-scalable=no">

<title>宿題提出スキャナー</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================

   基本

===================================================== */

* {

    box-sizing: border-box;

}

html,

body {

    margin: 0;

    padding: 0;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        "Noto Sans JP",

        sans-serif;

    background: #eef2f7;

    color: #222;

}

/* =====================================================

   ヘッダー

===================================================== */

header {

    background:

        linear-gradient(

            135deg,

            #4f8cff,

            #6c5ce7

        );

    color: white;

    padding: 12px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 21px;

}

/* =====================================================

   全体

===================================================== */

.container {

    width: 100%;

    max-width: 1000px;

    margin: auto;

    padding: 6px;

}

/* =====================================================

   カード

===================================================== */

.card {

    background: white;

    border-radius: 16px;

    padding: 12px;

    margin-bottom: 9px;

    box-shadow:

        0 3px 12px

        rgba(0,0,0,0.08);

}

/* =====================================================

   スキャンエリア

===================================================== */

.scan-card {

    padding: 7px;

}

.scan-header {

    display: flex;

    align-items: center;

    justify-content:

        space-between;

    gap: 8px;

    padding:

        3px 5px 8px;

}

.scan-header h2 {

    margin: 0;

    font-size: 19px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.today-date {

    font-size: 12px;

    color: #666;

    white-space: nowrap;

}

/* =====================================================

   カメラ

===================================================== */

#reader {

    width: 100%;

    background: #000;

    border-radius: 14px;

    overflow: hidden;

}

/*

   カメラ映像を大きく

*/

#reader video {

    width: 100% !important;

    height: auto !important;

    max-height: 72vh;

    object-fit: cover !important;

}

/*

   QR読み取り範囲

*/

#reader__scan_region {

    width: 100% !important;

}

#reader__scan_region img {

    display: none !important;

}

/*

   html5-qrcodeの下部

*/

#reader__dashboard {

    background: #111;

    padding: 7px !important;

}

#reader__dashboard button {

    padding: 9px 13px;

    border-radius: 9px;

    font-size: 15px;

}

/* =====================================================

   スキャン結果

===================================================== */

.scan-result {

    margin-top: 7px;

    padding: 11px;

    text-align: center;

    border-radius: 13px;

    background: #edf2ff;

}

.scan-result-number {

    font-size: 45px;

    line-height: 1;

    font-weight: 900;

}

.scan-result-text {

    margin-top: 5px;

    font-size: 16px;

    font-weight: bold;

}

.scan-result.ok {

    background: #dff7e5;

    color: #15803d;

}

.scan-result.error {

    background: #ffe2e2;

    color: #c0392b;

}

/* =====================================================

   提出数

===================================================== */

.big-count {

    text-align: center;

    padding: 8px 0 11px;

}

.big-count-number {

    font-size: 56px;

    line-height: 1;

    font-weight: 900;

}

.big-count-number span {

    color: #777;

}

.big-count-label {

    margin-top: 4px;

    font-size: 14px;

}

/* =====================================================

   プログレスバー

===================================================== */

.progress {

    width: 100%;

    height: 17px;

    background: #e5e7eb;

    border-radius: 20px;

    overflow: hidden;

}

.progress-bar {

    height: 100%;

    width: 0%;

    background: #27ae60;

    transition:

        width 0.25s ease;

}

/* =====================================================

   未提出者

===================================================== */

.remaining-box {

    margin-top: 13px;

    padding: 13px;

    border-radius: 14px;

    background: #fff3f3;

    text-align: center;

}

.remaining-title {

    margin-bottom: 9px;

    font-size: 22px;

    font-weight: 900;

    color: #d63031;

}

.remaining-list {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 7px;

}

.remaining-student {

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 46px;

    height: 40px;

    padding:

        0 8px;

    border-radius: 9px;

    background: white;

    border:

        2px solid #ff7675;

    color: #d63031;

    font-size: 18px;

    font-weight: 900;

}

.remaining-box.complete {

    background: #e6f9ed;

}

.remaining-box.complete

.remaining-title {

    color: #159957;

    font-size: 28px;

}

.remaining-box.complete

.remaining-list {

    display: none;

}

/* =====================================================

   欠席表示

===================================================== */

.absent-info {

    margin-top: 7px;

    font-size: 14px;

    color: #777;

}

/* =====================================================

   ボタン

===================================================== */

button {

    border: none;

    border-radius: 10px;

    padding: 10px 14px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    background: #4f8cff;

    color: white;

}

button:active {

    transform:

        scale(0.97);

}

button.success {

    background: #27ae60;

}

button.warning {

    background: #f39c12;

}

button.danger {

    background: #e74c3c;

}

button.secondary {

    background: #777;

}

/* =====================================================

   入力

===================================================== */

input,

select {

    width: 100%;

    min-width: 0;

    padding: 10px;

    border:

        1px solid #ccc;

    border-radius: 10px;

    background: white;

    font-size: 16px;

}

/* =====================================================

   行

===================================================== */

.row {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

}

.row > * {

    flex: 1;

}

/* =====================================================

   今日の全員一覧

===================================================== */

.list {

    display: grid;

    grid-template-columns:

        repeat(5, 1fr);

    gap: 5px;

}

.student {

    padding: 8px 3px;

    border-radius: 8px;

    text-align: center;

    font-weight: bold;

    background: #f1f3f5;

}

.student.submitted {

    background: #dff7e5;

    color: #15803d;

}

.student.absent {

    background: #ffe1e1;

    color: #c0392b;

}

/* =====================================================

   その他

===================================================== */

.small {

    font-size: 13px;

    color: #666;

}

h3 {

    margin-top: 0;

}

/* =====================================================

   iPhone

===================================================== */

@media (

    max-width: 600px

) {

    .container {

        padding: 4px;

    }

    .card {

        padding: 9px;

        border-radius: 13px;

    }

    #reader video {

        min-height: 360px;

    }

    .list {

        grid-template-columns:

            repeat(5, 1fr);

    }

    .student {

        font-size: 14px;

    }

}

/* =====================================================

   横向き

===================================================== */

@media (

    orientation: landscape

) and (

    max-height: 600px

) {

    #reader video {

        max-height: 70vh;

    }

}

</style>

</head>

<body>

<header>

<h1>

📚 宿題提出スキャナー

</h1>

</header>

<div class="container">

<!-- =================================================

     スキャン

================================================= -->

<div class="card scan-card">

<div class="scan-header">

<h2 id="current-task-name">

宿題を選択してください

</h2>

<div

id="today-date"

class="today-date">

</div>

</div>

<div id="reader"></div>

<div

id="scan-result"

class="scan-result">

<div

id="scan-number"

class="scan-result-number">

－

</div>

<div

id="scan-message"

class="scan-result-text">

📷 QRコードをかざしてください

</div>

</div>

</div>

<!-- =================================================

     提出状況

================================================= -->

<div class="card">

<div class="big-count">

<div class="big-count-number">

<span id="submitted-count">

0

</span>

<span>

/

</span>

<span id="class-size-display">

30

</span>

</div>

<div class="big-count-label">

提出済み

</div>

</div>

<div class="progress">

<div

id="progress-bar"

class="progress-bar">

</div>

</div>

<div

id="remaining-box"

class="remaining-box">

<div

id="remaining-title"

class="remaining-title">

🔴 あと30人！

</div>

<div

id="remaining-list"

class="remaining-list">

</div>

<div

id="absent-info"

class="absent-info">

</div>

</div>

</div>

<!-- =================================================

     宿題

================================================= -->

<div class="card">

<h3>

📚 宿題

</h3>

<select

id="task-select">

</select>

<div

class="row"

style="margin-top:7px;">

<button

onclick="addTask()">

＋ 宿題追加

class="danger"

onclick="deleteCurrentTask()">

宿題削除

class="small"

style="display:block;margin-top:8px;">

<input

type="checkbox"

id="today-only"

checked

style="width:auto;"

onchange="renderTaskSelect()">

今日の宿題だけ表示

<!-- =================================================

     欠席

================================================= -->

<div class="card">

<input

id="absent-input"

type="text"

inputmode="numeric"

placeholder="児童番号（例：03）">

class="warning"

onclick="registerAbsent()">

欠席登録

</div>

</div>

<!-- =================================================

     今日の全員

================================================= -->

<div class="card">

<h3>

👥 今日の状況

</h3>

<div

id="submission-list"

class="list">

</div>

</div>

<!-- =================================================

     QRコード

================================================= -->

<div class="card">

<h3>

🔳 児童用QRコード作成

</h3>

<div class="row">

<input

id="qr-input"

type="text"

inputmode="numeric"

placeholder="児童番号（例：01）">

onclick="generateQR()">

作成

style="text-align:center;margin-top:15px;">

<!-- =================================================

     設定

================================================= -->

<div class="card">

⚙️ 設定

</h3>

id="class-size"

type="number"

min="1"

max="100"

placeholder="学級人数">

<button

onclick="saveClassSize()">

保存

</button>

</div>

</div>

<!-- =================================================

     データ

================================================= -->

<div class="card">

<h3>

📊 データ

</h3>

<div class="row">

<button

class="success"

onclick="exportToCSV()">

今日のCSV

</button>

<button

class="secondary"

onclick="showTotalStats()">

累積統計

</button>

</div>

<script>

/* =====================================================

   保存キー

===================================================== */

const STORAGE_KEY_TASKS =

"homework_task_list_v5";

const STORAGE_PREFIX =

"homework_data_v5_";

const STORAGE_CLASS_SIZE =

"homework_class_size_v5";

const STORAGE_OCCURRENCES =

"homework_occurrences_v5";

/* =====================================================

   状態

===================================================== */

let tasks = [];

let currentTaskId = "";

let submittedSet =

    new Set();

let absentSet =

    new Set();

let historyData = [];

let classSize = 30;

let scanner = null;

let isProcessing = false;

let audioContext = null;

/*

   最後に読み取ったQR

   同じQRがカメラに残っていても

   何度も処理しないため

*/

let lastScanText = "";

let lastScanTime = 0;

/* =====================================================

   初期化

===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        loadClassSize();

        loadTasks();

        renderTaskSelect();

        updateTodayDate();

        updateStatus();

        createAudioContext();

    }

);

/* =====================================================

   日付

===================================================== */

function getDateKey() {

    const d =

        new Date();

    const y =

        d.getFullYear();

    const m =

        String(

            d.getMonth() + 1

        ).padStart(2,"0");

    const day =

        String(

            d.getDate()

        ).padStart(2,"0");

    return (

        y +

        "-" +

        m +

        "-" +

        day

    );

}

function updateTodayDate() {

    document

        .getElementById(

            "today-date"

        )

        .textContent =

        new Date()

        .toLocaleDateString(

            "ja-JP"

        );

}

/* =====================================================

   時刻

===================================================== */

function getTimeString() {

    return new Date()

        .toLocaleTimeString(

            "ja-JP",

            {

                hour:

                    "2-digit",

                minute:

                    "2-digit",

                second:

                    "2-digit"

            }

        );

}

/* =====================================================

   UUID

===================================================== */

function createId() {

    if (

        window.crypto &&

        crypto.randomUUID

    ) {

        return crypto.randomUUID();

    }

    return (

        Date.now()

            .toString(36) +

        Math.random()

            .toString(36)

            .slice(2)

    );

}

/* =====================================================

   児童番号

===================================================== */

function normalizeStudentId(

    value

) {

    value =

        String(value)

        .trim();

    /*

       全角数字を半角へ

    */

    value =

        value.replace(

            /[０-９]/g,

            function(s) {

                return String

                    .fromCharCode(

                        s.charCodeAt(0)

                        - 0xfee0

                    );

            }

        );

    /*

       数字以外

    */

    if (

        !/^\d+$/.test(value)

    ) {

        return null;

    }

    const number =

        parseInt(

            value,

            10

        );

    /*

       学級人数

    */

    if (

        number < 1 ||

        number > classSize

    ) {

        return null;

    }

    /*

       01～09に統一

    */

    if (

        number < 10

    ) {

        return (

            "0" +

            number

        );

    }

    return String(number);

}

/* =====================================================

   タスク読み込み

===================================================== */

function loadTasks() {

    const saved =

        localStorage.getItem(

            STORAGE_KEY_TASKS

        );

    if (saved) {

        try {

            tasks =

                JSON.parse(

                    saved

                );

        } catch {

            tasks = [];

        }

    }

    if (

        !Array.isArray(tasks) ||

        tasks.length === 0

    ) {

        tasks = [

            {

                id:

                    createId(),

                name:

                    "漢字ドリル",

                repeatType:

                    "everyday",

                days:

                    [],

                date:

                    ""

            },

            {

                id:

                    createId(),

                name:

                    "計算プリント",

                repeatType:

                    "everyday",

                days:

                    [],

                date:

                    ""

            }

        ];

        saveTasks();

    }

}

function saveTasks() {

    localStorage.setItem(

        STORAGE_KEY_TASKS,

        JSON.stringify(

            tasks

        )

    );

}

/* =====================================================

   今日の宿題判定

===================================================== */

function isTaskActiveToday(

    task

) {

    const today =

        new Date();

    if (

        task.repeatType ===

        "everyday"

    ) {

        return true;

    }

    if (

        task.repeatType ===

        "weekly"

    ) {

        return (

            Array.isArray(

                task.days

            ) &&

            task.days.includes(

                today.getDay()

            )

        );

    }

    if (

        task.repeatType ===

        "monthly"

    ) {

        return (

            parseInt(

                task.date,

                10

            ) ===

            today.getDate()

        );

    }

    if (

        task.repeatType ===

        "once"

    ) {

        return (

            task.date ===

            getDateKey()

        );

    }

    return false;

}

/* =====================================================

   宿題一覧

===================================================== */

function renderTaskSelect() {

    const select =

        document.getElementById(

            "task-select"

        );

    const todayOnly =

        document.getElementById(

            "today-only"

        ).checked;

    select.innerHTML =

        "";

    const visibleTasks =

        todayOnly

        ? tasks.filter(

            isTaskActiveToday

        )

        : tasks;

    visibleTasks.forEach(

        function(task) {

            const option =

                document.createElement(

                    "option"

                );

            option.value =

                task.id;

            option.textContent =

                task.name;

            select.appendChild(

                option

            );

        }

    );

    if (

        visibleTasks.length === 0

    ) {

        currentTaskId =

            "";

        clearCurrentData();

        document

            .getElementById(

                "current-task-name"

            )

            .textContent =

            "今日の宿題はありません";

        return;

    }

    const exists =

        visibleTasks.some(

            function(task) {

                return (

                    task.id ===

                    currentTaskId

                );

            }

        );

    if (!exists) {

        currentTaskId =

            visibleTasks[0].id;

    }

    select.value =

        currentTaskId;

    loadCurrentTaskData();

}

/* =====================================================

   宿題変更

===================================================== */

document

    .getElementById(

        "task-select"

    )

    .addEventListener(

        "change",

        function() {

            currentTaskId =

                this.value;

            loadCurrentTaskData();

        }

    );

/* =====================================================

   データ保存キー

===================================================== */

function getStorageKey() {

    return (

        STORAGE_PREFIX +

        currentTaskId +

        "_" +

        getDateKey()

    );

}

/* =====================================================

   今日のデータ読み込み

===================================================== */

function loadCurrentTaskData() {

    submittedSet.clear();

    absentSet.clear();

    historyData = [];

    if (!currentTaskId) {

        clearList();

        updateCount();

        return;

    }

    const task =

        tasks.find(

            function(t) {

                return (

                    t.id ===

                    currentTaskId

                );

            }

        );

    if (task) {

        document

            .getElementById(

                "current-task-name"

            )

            .textContent =

            "📚 " +

            task.name;

    }

    const saved =

        localStorage.getItem(

            getStorageKey()

        );

    if (saved) {

        try {

            historyData =

                JSON.parse(

                    saved

                );

        } catch {

            historyData = [];

        }

    }

    historyData.forEach(

        function(item) {

            if (

                item.status ===

                "absent"

            ) {

                absentSet.add(

                    item.id

                );

            }

            else {

                submittedSet.add(

                    item.id

                );

            }

        }

    );

    ensureOccurrence(

        task

    );

    renderAllStudents();

    updateCount();

}

/* =====================================================

   データ保存

===================================================== */

function saveData() {

    if (!currentTaskId) {

        return;

    }

    localStorage.setItem(

        getStorageKey(),

        JSON.stringify(

            historyData

        )

    );

}

/* =====================================================

   宿題実施回数を記録

===================================================== */

function ensureOccurrence(

    task

) {

    if (!task) {

        return;

    }

    if (

        !isTaskActiveToday(task)

    ) {

        return;

    }

    let occurrences = [];

    const saved =

        localStorage.getItem(

            STORAGE_OCCURRENCES

        );

    if (saved) {

        try {

            occurrences =

                JSON.parse(

                    saved

                );

        } catch {

            occurrences = [];

        }

    }

    if (

        !Array.isArray(

            occurrences

        )

    ) {

        occurrences = [];

    }

    const exists =

        occurrences.some(

            function(item) {

                return (

                    item.taskId ===

                    task.id &&

                    item.date ===

                    getDateKey()

                );

            }

        );

    if (!exists) {

        occurrences.push({

            taskId:

                task.id,

            taskName:

                task.name,

            date:

                getDateKey(),

            classSize:

                classSize

        });

        localStorage.setItem(

            STORAGE_OCCURRENCES,

            JSON.stringify(

                occurrences

            )

        );

    }

}

/* =====================================================

   カメラ開始

===================================================== */

function startScanner() {

    if (scanner) {

        return;

    }

    scanner =

        new Html5Qrcode(

            "reader"

        );

    const config = {

        fps: 20,

        /*

           読み取り範囲を

           カメラ画面の90%

        */

        qrbox:

            function(

                width,

                height

            ) {

                const size =

                    Math.floor(

                        Math.min(

                            width,

                            height

                        ) * 0.90

                    );

                return {

                    width:

                        size,

                    height:

                        size

                };

            },

        aspectRatio:

            1.0,

        experimentalFeatures: {

            useBarCodeDetectorIfSupported:

                true

        }

    };

    scanner

        .start(

            {

                facingMode:

                    "environment"

            },

            config,

            onScanSuccess,

            onScanFailure

        )

        .then(

            function() {

                updateStatusMessage(

                    "📷 次のQRコードをどうぞ"

                );

            }

        )

        .catch(

            function(error) {

                console.error(

                    error

                );

                updateStatusMessage(

                    "⚠️ カメラを起動できません。カメラの許可を確認してください。",

                    true

                );

            }

        );

}

/* =====================================================

   QR読み取り成功

===================================================== */

function onScanSuccess(

    decodedText

) {

    const now =

        Date.now();

    /*

       同じQRが画面に残った場合、

       1.5秒以内なら無視

    */

    if (

        decodedText ===

            lastScanText &&

        now -

            lastScanTime <

            1500

    ) {

        return;

    }

    lastScanText =

        decodedText;

    lastScanTime =

        now;

    /*

       少しだけ処理を止める

       → 連続誤読防止

    */

    if (

        isProcessing

    ) {

        return;

    }

    isProcessing =

        true;

    setTimeout(

        function() {

            isProcessing =

                false;

        },

        850

    );

    if (!currentTaskId) {

        showScanResult(

            "－",

            "⚠️ 先に宿題を選択してください",

            "error"

        );

        playErrorSound();

        return;

    }

    const studentId =

        normalizeStudentId(

            decodedText

        );

    /*

       無効番号

    */

    if (!studentId) {

        showScanResult(

            "－",

            "❌ 無効な児童番号",

            "error"

        );

        playErrorSound();

        return;

    }

    /*

       すでに提出

    */

    if (

        submittedSet.has(

            studentId

        )

    ) {

        showScanResult(

            studentId,

            "⚠️ すでに提出済み",

            "error"

        );

        playDuplicateSound();

        return;

    }

    /*

       欠席登録済み

    */

    if (

        absentSet.has(

            studentId

        )

    ) {

        showScanResult(

            studentId,

            "📕 欠席登録済み",

            "error"

        );

        playErrorSound();

        return;

    }

    /*

       提出

    */

    const item = {

        id:

            studentId,

        date:

            getDateKey(),

        time:

            getTimeString(),

        status:

            "submitted"

    };

    submittedSet.add(

        studentId

    );

    historyData.push(

        item

    );

    saveData();

    renderAllStudents();

    updateCount();

    /*

       全員提出か？

    */

    const remaining =

        classSize -

        submittedSet.size -

        absentSet.size;

    if (

        remaining <= 0

    ) {

        showScanResult(

            studentId,

            "🎉 全員提出！！",

            "ok"

        );

        playCompleteSound();

    }

    else {

        showScanResult(

            studentId,

            "✅ 提出完了！",

            "ok"

        );

        playSuccessSound();

    }

    /*

       少ししたら通常表示

    */

    setTimeout(

        function() {

            if (

                !isProcessing

            ) {

                updateStatusMessage(

                    "📷 次のQRコードをどうぞ"

                );

            }

        },

        1200

    );

}

/* =====================================================

   全員一覧

===================================================== */

function renderAllStudents() {

    const list =

        document.getElementById(

            "submission-list"

        );

    list.innerHTML =

        "";

    for (

        let i = 1;

        i <= classSize;

        i++

    ) {

        const id =

            i < 10

            ? "0" + i

            : String(i);

        const div =

            document.createElement(

                "div"

            );

        div.className =

            "student";

        if (

            submittedSet.has(id)

        ) {

            div.classList.add(

                "submitted"

            );

            div.textContent =

                "✓ " + id;

        }

        else if (

            absentSet.has(id)

        ) {

            div.classList.add(

                "absent"

            );

            div.textContent =

                "欠 " + id;

        }

        else {

            div.textContent =

                id;

        }

        list.appendChild(

            div

        );

    }

    updateCount();

}

/* =====================================================

   提出数更新

===================================================== */

function updateCount() {

    const submitted =

        submittedSet.size;

    const absent =

        absentSet.size;

    const remaining =

        Math.max(

            0,

            classSize -

            submitted -

            absent

        );

    /*

       数字

    */

    document

        .getElementById(

            "submitted-count"

        )

        .textContent =

        submitted;

    document

        .getElementById(

            "class-size-display"

        )

        .textContent =

        classSize;

    /*

       提出率

       欠席は分母から除外

    */

    const possible =

        Math.max(

            0,

            classSize -

            absent

        );

    const percentage =

        possible > 0

        ? submitted /

          possible *

          100

        : 100;

    document

        .getElementById(

            "progress-bar"

        )

        .style.width =

        Math.min(

            100,

            percentage

        ) + "%";

    renderRemainingStudents(

        remaining,

        absent

    );

}

/* =====================================================

   未提出者

===================================================== */

function renderRemainingStudents(

    remaining,

    absent

) {

    const box =

        document.getElementById(

            "remaining-box"

        );

    const title =

        document.getElementById(

            "remaining-title"

        );

    const list =

        document.getElementById(

            "remaining-list"

        );

    const absentInfo =

        document.getElementById(

            "absent-info"

        );

    list.innerHTML =

        "";

    /*

       欠席表示

    */

    if (absent > 0) {

        absentInfo.textContent =

            `📕 欠席 ${absent}人`;

    }

    else {

        absentInfo.textContent =

            "";

    }

    /*

       全員提出

    */

    if (

        remaining === 0

    ) {

        box.classList.add(

            "complete"

        );

        title.textContent =

            "🎉 全員提出！！ 🎉";

        return;

    }

    /*

       未提出あり

    */

    box.classList.remove(

        "complete"

    );

    title.textContent =

        `🔴 あと${remaining}人！`;

    /*

       児童番号を確認

    */

    for (

        let i = 1;

        i <= classSize;

        i++

    ) {

        const id =

            i < 10

            ? "0" + i

            : String(i);

        if (

            submittedSet.has(id)

        ) {

            continue;

        }

        if (

            absentSet.has(id)

        ) {

            continue;

        }

        const div =

            document.createElement(

                "div"

            );

        div.className =

            "remaining-student";

        div.textContent =

            id;

        list.appendChild(

            div

        );

    }

}

/* =====================================================

   宿題追加

===================================================== */

function addTask() {

    const name =

        prompt(

            "宿題の名前を入力してください。"

        );

    if (

        !name ||

        !name.trim()

    ) {

        return;

    }

    const type =

        prompt(

            "繰り返しを選んでください。\n\n" +

            "1：毎日\n" +

            "2：毎週\n" +

            "3：毎月\n" +

            "4：一度だけ"

        );

    const task = {

        id:

            createId(),

        name:

            name.trim(),

        repeatType:

            "everyday",

        days:

            [],

        date:

            ""

    };

    /*

       毎週

    */

    if (

        type === "2"

    ) {

        const day =

            parseInt(

                prompt(

                    "曜日を入力してください。\n\n" +

                    "0：日\n" +

                    "1：月\n" +

                    "2：火\n" +

                    "3：水\n" +

                    "4：木\n" +

                    "5：金\n" +

                    "6：土"

                ),

                10

            );

        if (

            day >= 0 &&

            day <= 6

        ) {

            task.repeatType =

                "weekly";

            task.days =

                [day];

        }

    }

    /*

       毎月

    */

    else if (

        type === "3"

    ) {

        task.repeatType =

            "monthly";

        task.date =

            prompt(

                "毎月何日に出しますか？\n例：15"

            );

    }

    /*

       一度だけ

    */

    else if (

        type === "4"

    ) {

        task.repeatType =

            "once";

        task.date =

            prompt(

                "提出日を入力してください。\n例：2026-09-10"

            );

    }

    tasks.push(

        task

    );

    saveTasks();

    currentTaskId =

        task.id;

    renderTaskSelect();

}

/* =====================================================

   宿題削除

===================================================== */

function deleteCurrentTask() {

    if (!currentTaskId) {

        return;

    }

    const task =

        tasks.find(

            function(t) {

                return (

                    t.id ===

                    currentTaskId

                );

            }

        );

    if (!task) {

        return;

    }

    const ok =

        confirm(

            `「${task.name}」を削除しますか？\n\n` +

            "過去の提出データは残ります。"

        );

    if (!ok) {

        return;

    }

    tasks =

        tasks.filter(

            function(t) {

                return (

                    t.id !==

                    currentTaskId

                );

            }

        );

    saveTasks();

    currentTaskId =

        "";

    renderTaskSelect();

}

/* =====================================================

   CSV出力

===================================================== */

function exportToCSV() {

    if (!currentTaskId) {

        alert(

            "宿題を選択してください。"

        );

        return;

    }

    const task =

        tasks.find(

            function(t) {

                return (

                    t.id ===

                    currentTaskId

                );

            }

        );

    if (!task) {

        return;

    }

    let csv =

        "児童番号,日付,時刻,状態\n";

    historyData.forEach(

        function(item) {

            csv +=

                item.id +

                "," +

                item.date +

                "," +

                item.time +

                "," +

                (

                    item.status ===

                    "absent"

                    ? "欠席"

                    : "提出"

                ) +

                "\n";

        }

    );

    const blob =

        new Blob(

            [

                "\uFEFF" +

                csv

            ],

            {

                type:

                    "text/csv;charset=utf-8"

            }

        );

    const url =

        URL.createObjectURL(

            blob

        );

    const a =

        document.createElement(

            "a"

        );

    a.href =

        url;

    a.download =

        task.name +

        "_" +

        getDateKey() +

        ".csv";

    a.click();

    URL.revokeObjectURL(

        url

    );

}

/* =====================================================

   累積統計

===================================================== */

function showTotalStats() {

    const saved =

        localStorage.getItem(

            STORAGE_OCCURRENCES

        );

    let occurrences = [];

    if (saved) {

        try {

            occurrences =

                JSON.parse(

                    saved

                );

        } catch {

            occurrences = [];

        }

    }

    if (

        !Array.isArray(

            occurrences

        )

    ) {

        occurrences = [];

    }

    let submitted = 0;

    let absent = 0;

    let possible = 0;

    occurrences.forEach(

        function(occurrence) {

            const key =

                STORAGE_PREFIX +

                occurrence.taskId +

                "_" +

                occurrence.date;

            const savedData =

                localStorage.getItem(

                    key

                );

            let data = [];

            if (savedData) {

                try {

                    data =

                        JSON.parse(

                            savedData

                        );

                } catch {

                    data = [];

                }

            }

            let submittedThisTime = 0;

            let absentThisTime = 0;

            data.forEach(

                function(item) {

                    if (

                        item.status ===

                        "absent"

                    ) {

                        absentThisTime++;

                    }

                    else {

                        submittedThisTime++;

                    }

                }

            );

            submitted +=

                submittedThisTime;

            absent +=

                absentThisTime;

            possible +=

                Math.max(

                    0,

                    occurrence.classSize -

                    absentThisTime

                );

        }

    );

    const unsubmitted =

        Math.max(

            0,

            possible -

            submitted

        );

    const rate =

        possible > 0

        ? Math.round(

            submitted /

            possible *

            100

        )

        : 0;

    alert(

        "📊 累積統計\n\n" +

        `宿題実施回数：${occurrences.length}回\n\n` +

        `提出回数：${submitted}回\n` +

        `欠席回数：${absent}回\n` +

        `未提出回数：${unsubmitted}回\n\n` +

        `累積提出率：${rate}%`

    );

}

/* =====================================================

   音声

===================================================== */

function createAudioContext() {

    try {

        const AudioContext =

            window.AudioContext ||

            window.webkitAudioContext;

        if (AudioContext) {

            audioContext =

                new AudioContext();

        }

    } catch {

        audioContext =

            null;

    }

}

function resumeAudio() {

    if (

        audioContext &&

        audioContext.state ===

        "suspended"

    ) {

        audioContext.resume();

    }

}

/* =====================================================

   成功音

===================================================== */

function playSuccessSound() {

    resumeAudio();

    if (!audioContext) {

        return;

    }

    const now =

        audioContext.currentTime;

    const osc =

        audioContext

        .createOscillator();

    const gain =

        audioContext

        .createGain();

    osc.type =

        "sine";

    osc.frequency

        .setValueAtTime(

            880,

            now

        );

    osc.frequency

        .setValueAtTime(

            1320,

            now + 0.08

        );

    gain.gain

        .setValueAtTime(

            0.001,

            now

        );

    gain.gain

        .exponentialRampToValueAtTime(

            0.25,

            now + 0.01

        );

    gain.gain

        .exponentialRampToValueAtTime(

            0.001,

            now + 0.18

        );

    osc.connect(

        gain

    );

    gain.connect(

        audioContext.destination

    );

    osc.start(

        now

    );

    osc.stop(

        now + 0.2

    );

}

/* =====================================================

   二重提出音

===================================================== */

function playDuplicateSound() {

    resumeAudio();

    if (!audioContext) {

        return;

    }

    const now =

        audioContext.currentTime;

    const osc =

        audioContext

        .createOscillator();

    const gain =

        audioContext

        .createGain();

    osc.type =

        "square";

    osc.frequency

        .setValueAtTime(

            330,

            now

        );

    gain.gain

        .setValueAtTime(

            0.15,

            now

        );

    gain.gain

        .exponentialRampToValueAtTime(

            0.001,

            now + 0.25

        );

    osc.connect(

        gain

    );

    gain.connect(

        audioContext.destination

    );

    osc.start(

        now

    );

    osc.stop(

        now + 0.25

    );

}

/* =====================================================

   エラー音

===================================================== */

function playErrorSound() {

    resumeAudio();

    if (!audioContext) {

        return;

    }

    const now =

        audioContext.currentTime;

    const osc =

        audioContext

        .createOscillator();

    const gain =

        audioContext

        .createGain();

    osc.type =

        "sawtooth";

    osc.frequency

        .setValueAtTime(

            220,

            now

        );

    gain.gain

        .setValueAtTime(

            0.12,

            now

        );

    gain.gain

        .exponentialRampToValueAtTime(

            0.001,

            now + 0.18

        );

    osc.connect(

        gain

    );

    gain.connect(

        audioContext.destination

    );

    osc.start(

        now

    );

    osc.stop(

        now + 0.18

    );

}

/* =====================================================

   全員提出音

===================================================== */

function playCompleteSound() {

    resumeAudio();

    if (!audioContext) {

        return;

    }

    const now =

        audioContext.currentTime;

    const frequencies =

        [

            523,

            659,

            784,

            1047

        ];

    frequencies.forEach(

        function(freq, index) {

            const osc =

                audioContext

                .createOscillator();

            const gain =

                audioContext

                .createGain();

            const start =

                now +

                index * 0.12;

            osc.type =

                "sine";

            osc.frequency

                .setValueAtTime(

                    freq,

                    start

                );

            gain.gain

                .setValueAtTime(

                    0.001,

                    start

                );

            gain.gain

                .exponentialRampToValueAtTime(

                    0.25,

                    start + 0.02

                );

            gain.gain

                .exponentialRampToValueAtTime(

                    0.001,

                    start + 0.28

                );

            osc.connect(

                gain

            );

            gain.connect(

                audioContext.destination

            );

            osc.start(

                start

            );

            osc.stop(

                start + 0.3

            );

        }

    );

}
