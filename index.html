<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0,

               maximum-scale=1.0, user-scalable=no">

<title>宿題提出スキャナー</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Helvetica Neue",

        "Noto Sans JP",

        sans-serif;

    background: #f2f4f7;

    color: #222;

}

header {

    background: #2563eb;

    color: white;

    padding: 14px;

    text-align: center;

    font-size: 22px;

    font-weight: bold;

}

.container {

    max-width: 1000px;

    margin: auto;

    padding: 10px;

}

/* =========================

   スキャナー

========================= */

.scanner-card {

    background: #000;

    border-radius: 16px;

    overflow: hidden;

    position: relative;

    margin-bottom: 10px;

}

#reader {

    width: 100%;

    min-height: 60vh;

}

#reader video {

    width: 100% !important;

    height: auto !important;

    object-fit: cover;

}

#reader__scan_region {

    width: 100% !important;

}

#reader__dashboard {

    background: #111 !important;

    color: white !important;

    padding: 8px !important;

}

#reader__dashboard_section_swaplink {

    color: white !important;

}

.scan-button {

    width: 100%;

    border: none;

    background: #16a34a;

    color: white;

    font-size: 24px;

    font-weight: bold;

    padding: 18px;

    border-radius: 14px;

    margin-bottom: 10px;

}

.scan-button.stop {

    background: #dc2626;

}

/* =========================

   最後に読んだ番号

========================= */

.last-scan {

    background: white;

    border-radius: 16px;

    padding: 15px;

    text-align: center;

    margin-bottom: 10px;

}

.last-label {

    font-size: 15px;

    color: #666;

}

.last-number {

    font-size: 80px;

    line-height: 1;

    font-weight: 900;

    margin: 5px 0;

}

.last-status {

    font-size: 24px;

    font-weight: bold;

}

/* =========================

   提出状況

========================= */

.status-card {

    background: white;

    border-radius: 16px;

    padding: 18px;

    margin-bottom: 10px;

    text-align: center;

}

.count {

    font-size: 64px;

    font-weight: 900;

    line-height: 1;

}

.count-label {

    font-size: 20px;

    color: #555;

}

.progress {

    width: 100%;

    height: 24px;

    background: #ddd;

    border-radius: 999px;

    overflow: hidden;

    margin-top: 15px;

}

.progress-bar {

    height: 100%;

    width: 0%;

    background: #22c55e;

    transition: width 0.3s;

}

.remaining-box {

    margin-top: 18px;

    padding: 15px;

    border-radius: 14px;

    background: #fff1f2;

}

.remaining-title {

    font-size: 25px;

    font-weight: bold;

    color: #dc2626;

}

.remaining-list {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    justify-content: center;

    margin-top: 12px;

}

.remaining-student {

    background: white;

    border: 2px solid #f87171;

    border-radius: 12px;

    padding: 7px 12px;

    font-size: 22px;

    font-weight: bold;

}

.complete {

    background: #dcfce7;

    color: #15803d;

}

.absent-info {

    margin-top: 10px;

    color: #666;

}

/* =========================

   設定

========================= */

.card {

    background: white;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 10px;

}

.card h2 {

    margin-top: 0;

    font-size: 20px;

}

input,

select,

button {

    font-size: 17px;

}

input,

select {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 10px;

    margin-bottom: 8px;

}

button {

    border: none;

    border-radius: 10px;

    padding: 12px 16px;

    font-weight: bold;

    cursor: pointer;

}

.primary {

    background: #2563eb;

    color: white;

}

.green {

    background: #16a34a;

    color: white;

}

.red {

    background: #dc2626;

    color: white;

}

.gray {

    background: #64748b;

    color: white;

}

.row {

    display: flex;

    gap: 8px;

}

.row > * {

    flex: 1;

}

/* =========================

   QR

========================= */

.qr-grid {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

}

.qr-item {

    text-align: center;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 10px;

    background: white;

}

.qr-number {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 5px;

}

.qr-code {

    display: flex;

    justify-content: center;

}

/* =========================

   スマホ

========================= */

@media (max-width: 600px) {

    header {

        font-size: 19px;

    }

    #reader {

        min-height: 55vh;

    }

    .last-number {

        font-size: 70px;

    }

    .count {

        font-size: 55px;

    }

    .qr-grid {

        grid-template-columns: repeat(2, 1fr);

    }

}

</style>

</head>

<body>

<header>

    📚 宿題提出スキャナー

</header>

<div class="container">

    <!-- =====================

         スキャン

    ====================== -->

    <button

        id="scanButton"

        class="scan-button"

        onclick="toggleScanner()">

        🔊 スキャン開始

    </button>

    <div class="scanner-card">

        <div id="reader"></div>

    </div>

    <!-- =====================

         最後の読み取り

    ====================== -->

    <div class="last-scan">

        <div class="last-label">

            最後に読み取った番号

        </div>

        <div id="lastNumber"

             class="last-number">

            --

        </div>

        <div id="lastStatus"

             class="last-status">

            QRコードを読み取ってください

        </div>

    </div>

    <!-- =====================

         提出状況

    ====================== -->

    <div class="status-card">

        <div id="count"

             class="count">

            0 / 37

        </div>

        <div class="count-label">

            提出済み

        </div>

        <div class="progress">

            <div id="progressBar"

                 class="progress-bar">

            </div>

        </div>

        <div id="absentInfo"

             class="absent-info">

            欠席 0人

        </div>

        <div id="remainingBox"

             class="remaining-box">

            <div id="remainingTitle"

                 class="remaining-title">

                🔴 あと37人！

            </div>

            <div id="remainingList"

                 class="remaining-list">

            </div>

        </div>

    </div>

    <!-- =====================

         今日の宿題

    ====================== -->

    <div class="card">

        <h2>📝 今日の宿題</h2>

        <select id="taskSelect"

                onchange="changeTask()">

        </select>

        <div class="row">

            <button class="primary"

                    onclick="addTask()">

                ＋ 宿題追加

            </button>

            <button class="red"

                    onclick="deleteTask()">

                🗑 削除

            </button>

        </div>

    </div>

    <!-- =====================

         設定

    ====================== -->

    <div class="card">

        <h2>⚙️ クラス設定</h2>

        <label>

            クラス番号

        </label>

        <input

            id="classPrefix"

            type="number"

            inputmode="numeric"

            value="31"

            min="1"

            max="99">

        <div style="font-size:14px;color:#666;margin-bottom:10px;">

            例：3年1組 → 31 ／ 3年2組 → 32

        </div>

        <label>

            学級人数

        </label>

        <input

            id="classSize"

            type="number"

            inputmode="numeric"

            value="37"

            min="1"

            max="99">

        <button class="green"

                onclick="saveClassSettings()">

            💾 設定を保存

        </button>

    </div>

    <!-- =====================

         欠席

    ====================== -->

    <div class="card">

        <h2>🚫 欠席登録</h2>

        <input

            id="absentNumber"

            type="number"

            inputmode="numeric"

            min="1"

            placeholder="出席番号">

        <button class="gray"

                onclick="registerAbsent()">

            欠席として登録

        </button>

    </div>

    <!-- =====================

         QR生成

    ====================== -->

    <div class="card">

        <h2>🔳 QRコード作成</h2>

        <button class="primary"

                onclick="generateQRCodes()">

            QRコードを作成

        </button>

        <div id="qrGrid"

             class="qr-grid"

             style="margin-top:15px;">

        </div>

    </div>

    <!-- =====================

         CSV

    ====================== -->

    <div class="card">

        <h2>📊 データ</h2>

        <button class="green"

                onclick="exportCSV()">

            CSVで保存

        </button>

    </div>

</div>

<script>

/* =========================================================

   設定

========================================================= */

const STORAGE_TASKS =

    "homework_task_list_v4";

const STORAGE_PREFIX =

    "homework_data_v4_";

const STORAGE_CLASS_SIZE =

    "homework_class_size_v4";

const STORAGE_CLASS_PREFIX =

    "homework_class_prefix_v1";

const STORAGE_OCCURRENCES =

    "homework_occurrences_v1";

let tasks = [];

let currentTaskId = null;

let currentData = {

    submitted: {},

    absent: []

};

let scanner = null;

let scannerRunning = false;

let processingLock = false;

let lastRawCode = "";

let lastRawTime = 0;

let audioContext = null;

/* =========================================================

   ID

========================================================= */

function makeId() {

    if (

        window.crypto &&

        crypto.randomUUID

    ) {

        return crypto.randomUUID();

    }

    return Date.now().toString(36)

        + Math.random()

            .toString(36)

            .slice(2);

}

/* =========================================================

   日付

========================================================= */

function getDateKey() {

    const d = new Date();

    const y = d.getFullYear();

    const m = String(

        d.getMonth() + 1

    ).padStart(2, "0");

    const day = String(

        d.getDate()

    ).padStart(2, "0");

    return `${y}-${m}-${day}`;

}

/* =========================================================

   クラス設定

========================================================= */

function getClassSize() {

    return parseInt(

        localStorage.getItem(

            STORAGE_CLASS_SIZE

        ) || "37",

        10

    );

}

function getClassPrefix() {

    return String(

        localStorage.getItem(

            STORAGE_CLASS_PREFIX

        ) || "31"

    ).padStart(2, "0");

}

function saveClassSettings() {

    let size =

        parseInt(

            document.getElementById(

                "classSize"

            ).value,

            10

        );

    let prefix =

        parseInt(

            document.getElementById(

                "classPrefix"

            ).value,

            10

        );

    if (

        !Number.isInteger(size) ||

        size < 1 ||

        size > 99

    ) {

        alert(

            "学級人数は1〜99人で設定してください。"

        );

        return;

    }

    if (

        !Number.isInteger(prefix) ||

        prefix < 1 ||

        prefix > 99

    ) {

        alert(

            "クラス番号は1〜99で設定してください。"

        );

        return;

    }

    localStorage.setItem(

        STORAGE_CLASS_SIZE,

        String(size)

    );

    localStorage.setItem(

        STORAGE_CLASS_PREFIX,

        String(prefix).padStart(2, "0")

    );

    updateCount();

    alert(

        `設定しました。\n\nクラス：${String(prefix).padStart(2,"0")}\n人数：${size}人`

    );

}

/* =========================================================

   生徒番号変換

========================================================= */

function normalizeStudentId(value) {

    let text =

        String(value)

            .trim()

            .replace(

                /[０-９]/g,

                s =>

                    String.fromCharCode(

                        s.charCodeAt(0) - 0xfee0

                    )

            );

    if (!/^\d+$/.test(text)) {

        return null;

    }

    const prefix =

        getClassPrefix();

    const size =

        getClassSize();

    /*

       例

       3101 → 01

       3102 → 02

       3137 → 37

    */

    if (

        text.length === 4 &&

        text.slice(0, 2) === prefix

    ) {

        const number =

            parseInt(

                text.slice(2),

                10

            );

        if (

            number >= 1 &&

            number <= size

        ) {

            return String(

                number

            ).padStart(2, "0");

        }

        return null;

    }

    /*

       念のため

       01、1 なども許可

    */

    const number =

        parseInt(text, 10);

    if (

        number >= 1 &&

        number <= size

    ) {

        return String(

            number

        ).padStart(2, "0");

    }

    return null;

}

/* =========================================================

   タスク

========================================================= */

function loadTasks() {

    try {

        tasks =

            JSON.parse(

                localStorage.getItem(

                    STORAGE_TASKS

                ) || "[]"

            );

    } catch {

        tasks = [];

    }

    if (tasks.length === 0) {

        tasks = [

            {

                id: makeId(),

                name: "今日の宿題",

                type: "everyday"

            }

        ];

        saveTasks();

    }

    renderTaskSelect();

}

function saveTasks() {

    localStorage.setItem(

        STORAGE_TASKS,

        JSON.stringify(tasks)

    );

}

function renderTaskSelect() {

    const select =

        document.getElementById(

            "taskSelect"

        );

    select.innerHTML = "";

    tasks.forEach(task => {

        const option =

            document.createElement(

                "option"

            );

        option.value = task.id;

        option.textContent = task.name;

        select.appendChild(option);

    });

    if (currentTaskId) {

        select.value =

            currentTaskId;

    } else if (tasks.length > 0) {

        currentTaskId =

            tasks[0].id;

        select.value =

            currentTaskId;

    }

}

function addTask() {

    const name =

        prompt(

            "宿題の名前を入力してください"

        );

    if (!name) return;

    const type =

        prompt(

            "種類を入力してください\n\n" +

            "everyday：毎日\n" +

            "weekly：毎週\n" +

            "monthly：毎月\n" +

            "once：1回"

        ) || "everyday";

    const task = {

        id: makeId(),

        name: name,

        type: [

            "everyday",

            "weekly",

            "monthly",

            "once"

        ].includes(type)

            ? type

            : "everyday"

    };

    tasks.push(task);

    saveTasks();

    currentTaskId =

        task.id;

    renderTaskSelect();

    loadCurrentTaskData();

}

function deleteTask() {

    if (!currentTaskId) return;

    const task =

        tasks.find(

            t => t.id === currentTaskId

        );

    if (!task) return;

    if (

        !confirm(

            `「${task.name}」を宿題一覧から削除しますか？\n\n` +

            "過去の提出履歴は削除されません。"

        )

    ) {

        return;

    }

    tasks =

        tasks.filter(

            t => t.id !== currentTaskId

        );

    saveTasks();

    currentTaskId =

        tasks.length

            ? tasks[0].id

            : null;

    renderTaskSelect();

    loadCurrentTaskData();

}

function changeTask() {

    currentTaskId =

        document.getElementById(

            "taskSelect"

        ).value;

    loadCurrentTaskData();

}

/* =========================================================

   データ

========================================================= */

function getStorageKey() {

    return (

        STORAGE_PREFIX +

        currentTaskId +

        "_" +

        getDateKey()

    );

}

function loadCurrentTaskData() {

    if (!currentTaskId) {

        currentData = {

            submitted: {},

            absent: []

        };

        updateCount();

        return;

    }

    try {

        currentData =

            JSON.parse(

                localStorage.getItem(

                    getStorageKey()

                ) ||

                '{"submitted":{},"absent":[]}'

            );

    } catch {

        currentData = {

            submitted: {},

            absent: []

        };

    }

    updateCount();

}

function saveCurrentData() {

    localStorage.setItem(

        getStorageKey(),

        JSON.stringify(

            currentData

        )

    );

}

/* =========================================================

   欠席

========================================================= */

function registerAbsent() {

    const input =

        document.getElementById(

            "absentNumber"

        );

    const id =

        normalizeStudentId(

            input.value

        );

    if (!id) {

        alert(

            "正しい出席番号を入力してください。"

        );

        return;

    }

    if (

        currentData.submitted[id]

    ) {

        alert(

            `${id}番はすでに提出済みです。`

        );

        return;

    }

    if (

        currentData.absent.includes(id)

    ) {

        alert(

            `${id}番はすでに欠席登録されています。`

        );

        return;

    }

    currentData.absent.push(id);

    saveCurrentData();

    input.value = "";

    updateCount();

    playErrorSound();

}

/* =========================================================

   残り人数

========================================================= */

function getAllStudentIds() {

    const size =

        getClassSize();

    const result = [];

    for (

        let i = 1;

        i <= size;

        i++

    ) {

        result.push(

            String(i)

                .padStart(2, "0")

        );

    }

    return result;

}

function getRemainingStudents() {

    const all =

        getAllStudentIds();

    return all.filter(

        id =>

            !currentData.submitted[id] &&

            !currentData.absent.includes(id)

    );

}

function renderRemainingStudents(

    remaining

) {

    const box =

        document.getElementById(

            "remainingBox"

        );

    const title =

        document.getElementById(

            "remainingTitle"

        );

    const list =

        document.getElementById(

            "remainingList"

        );

    list.innerHTML = "";

    if (

        remaining.length === 0

    ) {

        box.classList.add(

            "complete"

        );

        title.textContent =

            "🎉 全員提出！！ 🎉";

        return;

    }

    box.classList.remove(

        "complete"

    );

    title.textContent =

        `🔴 あと${remaining.length}人！`;

    remaining.forEach(id => {

        const div =

            document.createElement(

                "div"

            );

        div.className =

            "remaining-student";

        div.textContent =

            id;

        list.appendChild(div);

    });

}

/* =========================================================

   提出状況

========================================================= */

function updateCount() {

    const size =

        getClassSize();

    const submitted =

        Object.keys(

            currentData.submitted

        ).length;

    const absent =

        currentData.absent.length;

    const remaining =

        getRemainingStudents();

    const denominator =

        Math.max(

            0,

            size - absent

        );

    const percentage =

        denominator === 0

            ? 100

            : Math.round(

                submitted /

                denominator *

                100

            );

    document.getElementById(

        "count"

    ).textContent =

        `${submitted} / ${size}`;

    document.getElementById(

        "progressBar"

    ).style.width =

        `${percentage}%`;

    document.getElementById(

        "absentInfo"

    ).textContent =

        `欠席 ${absent}人`;

    renderRemainingStudents(

        remaining

    );

    /*

       設定画面にも現在値を反映

    */

    document.getElementById(

        "classSize"

    ).value =

        size;

    document.getElementById(

        "classPrefix"

    ).value =

        parseInt(

            getClassPrefix(),

            10

        );

    /*

       画面を常に最新にする

    */

    document.title =

        `提出 ${submitted}/${size}`;

}

/* =========================================================

   QR読み取り

========================================================= */

async function toggleScanner() {

    if (scannerRunning) {

        stopScanner();

    } else {

        await startScanner();

    }

}

async function startScanner() {

    try {

        /*

           iPhoneではユーザー操作後に

           AudioContextを開始する

        */

        initAudio();

        if (audioContext) {

            await audioContext.resume();

        }

        scanner =

            new Html5Qrcode(

                "reader"

            );

        await scanner.start(

            {

                facingMode:

                    "environment"

            },

            {

                fps: 20,

                qrbox: function(

                    width,

                    height

                ) {

                    const size =

                        Math.floor(

                            Math.min(

                                width,

                                height

                            ) * 0.90

                        );

                    return {

                        width: size,

                        height: size

                    };

                },

                aspectRatio: 1.0

            },

            onScanSuccess,

            onScanFailure

        );

        scannerRunning =

            true;

        const button =

            document.getElementById(

                "scanButton"

            );

        button.textContent =

            "⏹ スキャン停止";

        button.classList.add(

            "stop"

        );

    } catch (error) {

        console.error(error);

        alert(

            "カメラを起動できませんでした。\n\n" +

            "iPhoneの場合は、Safariでカメラの使用を許可してください。"

        );

    }

}

async function stopScanner() {

    if (!scanner) return;

    try {

        await scanner.stop();

    } catch {}

    try {

        scanner.clear();

    } catch {}

    scanner = null;

    scannerRunning =

        false;

    const button =

        document.getElementById(

            "scanButton"

        );

    button.textContent =

        "🔊 スキャン開始";

    button.classList.remove(

        "stop"

    );

}

function onScanFailure(error) {

    /*

       何もしない

       カメラが連続して読み取るため、

       毎回エラー表示を出すと重くなる。

    */

}

/* =========================================================

   QR成功

========================================================= */

function onScanSuccess(

    decodedText

) {

    const now =

        Date.now();

    /*

       同じQRがカメラに映り続けた場合の

       連続読み取り防止

    */

    if (

        decodedText === lastRawCode &&

        now - lastRawTime < 1500

    ) {

        return;

    }

    lastRawCode =

        decodedText;

    lastRawTime =

        now;

    /*

       少しだけ処理ロック

    */

    if (processingLock) {

        return;

    }

    processingLock = true;

    setTimeout(

        () => {

            processingLock = false;

        },

        700

    );

    const id =

        normalizeStudentId(

            decodedText

        );

    const numberElement =

        document.getElementById(

            "lastNumber"

        );

    const statusElement =

        document.getElementById(

            "lastStatus"

        );

    /*

       無効QR

    */

    if (!id) {

        numberElement.textContent =

            "？";

        statusElement.textContent =

            "❌ 無効なQRコード";

        statusElement.style.color =

            "#dc2626";

        playErrorSound();

        return;

    }

    numberElement.textContent =

        id;

    /*

       欠席

    */

    if (

        currentData.absent.includes(id)

    ) {

        statusElement.textContent =

            "🚫 欠席登録されています";

        statusElement.style.color =

            "#dc2626";

        playErrorSound();

        return;

    }

    /*

       重複

    */

    if (

        currentData.submitted[id]

    ) {

        statusElement.textContent =

            "⚠️ すでに提出済み";

        statusElement.style.color =

            "#d97706";

        playDuplicateSound();

        return;

    }

    /*

       提出登録

    */

    currentData.submitted[id] =

        {

            time:

                new Date()

                    .toLocaleTimeString(

                        "ja-JP"

                    )

        };

    saveCurrentData();

    statusElement.textContent =

        "✅ 提出しました！";

    statusElement.style.color =

        "#16a34a";

    updateCount();

    /*

       全員提出判定

    */

    const remaining =

        getRemainingStudents();

    if (

        remaining.length === 0

    ) {

        playCompleteSound();

    } else {

        playSuccessSound();

    }

}

/* =========================================================

   音

========================================================= */

function initAudio() {

    if (!audioContext) {

        audioContext =

            new (

                window.AudioContext ||

                window.webkitAudioContext

            )();

    }

}

function beep(

    frequency,

    duration,

    type = "sine",

    volume = 0.12

) {

    if (!audioContext) {

        initAudio();

    }

    if (!audioContext) return;

    const oscillator =

        audioContext.createOscillator();

    const gain =

        audioContext.createGain();

    oscillator.type =

        type;

    oscillator.frequency.value =

        frequency;

    gain.gain.setValueAtTime(

        volume,

        audioContext.currentTime

    );

    gain.gain.exponentialRampToValueAtTime(

        0.001,

        audioContext.currentTime +

        duration

    );

    oscillator.connect(gain);

    gain.connect(

        audioContext.destination

    );

    oscillator.start();

    oscillator.stop(

        audioContext.currentTime +

        duration

    );

}

function playSuccessSound() {

    beep(

        880,

        0.15,

        "sine",

        0.14

    );

}

function playDuplicateSound() {

    beep(

        440,

        0.18,

        "square",

        0.08

    );

    setTimeout(

        () =>

            beep(

                330,

                0.18,

                "square",

                0.08

            ),

        120

    );

}

function playErrorSound() {

    beep(

        220,

        0.25,

        "sawtooth",

        0.08

    );

}

function playCompleteSound() {

    const notes = [

        523,

        659,

        784,

        1047

    ];

    notes.forEach(

        (note, index) => {

            setTimeout(

                () =>

                    beep(

                        note,

                        0.25,

                        "sine",

                        0.14

                    ),

                index * 150

            );

        }

    );

}

/* =========================================================

   QRコード生成

========================================================= */

function generateQRCodes() {

    const grid =

        document.getElementById(

            "qrGrid"

        );

    grid.innerHTML = "";

    const size =

        getClassSize();

    const prefix =

        getClassPrefix();

    for (

        let i = 1;

        i <= size;

        i++

    ) {

        const studentNumber =

            String(i)

                .padStart(2, "0");

        const qrData =

            prefix +

            studentNumber;

        const item =

            document.createElement(

                "div"

            );

        item.className =

            "qr-item";

        const number =

            document.createElement(

                "div"

            );

        number.className =

            "qr-number";

        number.textContent =

            `${studentNumber}番`;

        const qr =

            document.createElement(

                "div"

            );

        qr.className =

            "qr-code";

        item.appendChild(

            number

        );

        item.appendChild(

            qr

        );

        grid.appendChild(

            item

        );

        new QRCode(

            qr,

            {

                text: qrData,

                width: 180,

                height: 180,

                correctLevel:

                    QRCode.CorrectLevel.H

            }

        );

    }

}

/* =========================================================

   CSV

========================================================= */

function exportCSV() {

    if (!currentTaskId) {

        alert(

            "宿題を選択してください。"

        );

        return;

    }

    const task =

        tasks.find(

            t =>

                t.id ===

                currentTaskId

        );

    const size =

        getClassSize();

    let rows = [];

    rows.push(

        [

            "日付",

            "宿題",

            "出席番号",

            "状態",

            "提出時刻"

        ]

    );

    for (

        let i = 1;

        i <= size;

        i++

    ) {

        const id =

            String(i)

                .padStart(2, "0");

        let status =

            "未提出";

        let time = "";

        if (

            currentData.absent

                .includes(id)

        ) {

            status =

                "欠席";

        } else if (

            currentData.submitted[id]

        ) {

            status =

                "提出済み";

            time =

                currentData

                    .submitted[id]

                    .time || "";

        }

        rows.push(

            [

                getDateKey(),

                task

                    ? task.name

                    : "",

                id,

                status,

                time

            ]

        );

    }

    const csv =

        rows

            .map(

                row =>

                    row

                        .map(

                            value =>

                                `"${String(value)

                                    .replace(

                                        /"/g,

                                        '""'

                                    )}"`

                        )

                        .join(",")

            )

            .join("\n");

    const blob =

        new Blob(

            [

                "\uFEFF" +

                csv

            ],

            {

                type:

                    "text/csv;charset=utf-8;"

            }

        );

    const url =

        URL.createObjectURL(

            blob

        );

    const a =

        document.createElement(

            "a"

        );

    a.href = url;

    a.download =

        `宿題提出_${getDateKey()}.csv`;

    a.click();

    URL.revokeObjectURL(

        url

    );

}
